function createCrusaderShieldShape(scale=1){
  // C0079：参照蓝盾短剑骑士，保持宽顶、收腰、尖底的卡通骑士大盾。

}

function normalizeShieldFaceUV(geometry){
  geometry.computeBoundingBox();
  const box=geometry.boundingBox;
  const sx=Math.max(1e-6,box.max.x-box.min.x), sy=Math.max(1e-6,box.max.y-box.min.y);
  const p=geometry.attributes.position;
  const uv=new Float32Array(p.count*2);
  for(let i=0;i<p.count;i++){
    uv[i*2]=(p.getX(i)-box.min.x)/sx;
    uv[i*2+1]=(p.getY(i)-box.min.y)/sy;
  }
  geometry.setAttribute('uv',new THREE.BufferAttribute(uv,2));
}
function curveShieldGeometry(geometry,zOffset=0){

  const p=geometry.attributes.position;
  for(let i=0;i<p.count;i++)p.setZ(i,p.getZ(i)+zOffset);
  p.needsUpdate=true;
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();
  return geometry;
}
function clampShieldColorChannel(v){ return Math.max(0,Math.min(255,Math.round(v))); }

function createCrusaderShieldFaceTexture(primaryRgb,darkRgb){
  const size=768;

  const g=canvas.getContext('2d');
  g.clearRect(0,0,size,size);

  const brightPrimary=shadeShieldRgb(primaryRgb,0.24);
  const midPrimary=shadeShieldRgb(primaryRgb,0.06);
  const lowPrimary=shadeShieldRgb(primaryRgb,-0.18);
  const deepPrimary=shadeShieldRgb(primaryRgb,-0.40);
  const darkBandTop=shadeShieldRgb(darkRgb,-0.04);
  const darkBandBottom=shadeShieldRgb(darkRgb,-0.30);
  const accentLine=shadeShieldRgb(darkRgb,-0.22);
  const diamondStart=shadeShieldRgb(darkRgb,0.10);
  const diamondEnd=shadeShieldRgb(darkRgb,-0.34);
  const highlightEdge=shadeShieldRgb(primaryRgb,0.52);

  // 基础阵营色底色：沿用原有亮-中-深的三段关系，但实际颜色改为取自当前阵营标识色。
  const base=g.createLinearGradient(0,40,size,size-40);
  base.addColorStop(0,shieldRgbToCss(brightPrimary));
  base.addColorStop(0.28,shieldRgbToCss(midPrimary));
  base.addColorStop(0.72,shieldRgbToCss(lowPrimary));
  base.addColorStop(1,shieldRgbToCss(deepPrimary));
  g.fillStyle=base;
  g.fillRect(0,0,size,size);

  // 中部深色横带。
  const bandTop=Math.round(size*0.43), bandBottom=Math.round(size*0.67);
  const band=g.createLinearGradient(0,bandTop,0,bandBottom);
  band.addColorStop(0,shieldRgbToCss(darkBandTop));
  band.addColorStop(1,shieldRgbToCss(darkBandBottom));
  g.fillStyle=band;
  g.fillRect(0,bandTop,size,bandBottom-bandTop);

  // 左右分区的细微明暗差，维持原有卡通分块感。
  g.fillStyle='rgba(255,255,255,0.085)';
  g.fillRect(0,0,size*0.5,bandTop);
  g.fillStyle='rgba(0,0,0,0.08)';
  g.fillRect(size*0.5,0,size*0.5,bandTop);
  g.fillStyle='rgba(255,255,255,0.055)';
  g.fillRect(0,bandBottom,size*0.5,size-bandBottom);
  g.fillStyle='rgba(0,0,0,0.08)';
  g.fillRect(size*0.5,bandBottom,size*0.5,size-bandBottom);

  // 分区接缝。
  g.lineWidth=3;
  g.strokeStyle=shieldRgbToCss(accentLine);
  g.beginPath(); g.moveTo(size*0.5,0); g.lineTo(size*0.5,size); g.stroke();
  g.beginPath(); g.moveTo(0,bandTop); g.lineTo(size,bandTop); g.stroke();
  g.beginPath(); g.moveTo(0,bandBottom); g.lineTo(size,bandBottom); g.stroke();

  // 菱形纹样也随阵营色系变化，但保留深色装饰效果。
  const drawDiamond=(cx,cy,w,h)=>{
    g.beginPath();
    g.moveTo(cx,cy-h*0.5); g.lineTo(cx+w*0.5,cy); g.lineTo(cx,cy+h*0.5); g.lineTo(cx-w*0.5,cy); g.closePath();
    const dg=g.createLinearGradient(cx-w*0.5,cy-h*0.5,cx+w*0.5,cy+h*0.5);
    dg.addColorStop(0,shieldRgbToCss(diamondStart));
    dg.addColorStop(1,shieldRgbToCss(diamondEnd));
    g.fillStyle=dg; g.fill();
    g.lineWidth=3; g.strokeStyle=shieldRgbToCss(shadeShieldRgb(highlightEdge,0.10)); g.stroke();
  };
  drawDiamond(size*0.28,size*0.27,size*0.095,size*0.22);
  drawDiamond(size*0.72,size*0.27,size*0.095,size*0.22);
  drawDiamond(size*0.50,size*0.82,size*0.085,size*0.19);

  // 金属漆高光与轻微暗角。
  const hi=g.createLinearGradient(0,0,size*0.55,size);
  hi.addColorStop(0,'rgba(255,255,255,0.22)');
  hi.addColorStop(0.32,'rgba(255,255,255,0.04)');
  hi.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=hi; g.fillRect(0,0,size,size);
  const vignette=g.createRadialGradient(size*0.48,size*0.43,size*0.15,size*0.5,size*0.5,size*0.72);

  vignette.addColorStop(1,'rgba(0,0,0,0.20)');
  g.fillStyle=vignette; g.fillRect(0,0,size,size);

  const tex=new THREE.CanvasTexture(canvas);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=THREE.ClampToEdgeWrapping;

// C0092：近战兵 DrawCalls 批处理。
// 原模型保持全部几何细节与可动骨架，但同一“刚体节点”内不需要独立运动的零件

function c0092MergeGeometries(geometries){
  const geos=geometries.map(g=>g.index?g.toNonIndexed():g.clone());
  if(!geos.length) return null;

    const a=g.getAttribute(key),b=geos[0].getAttribute(key);
    return !!a && a.itemSize===b.itemSize && a.normalized===b.normalized && a.array.constructor===b.array.constructor;
  }));

  for(const key of keys){
    const first=geos[0].getAttribute(key);
    const total=geos.reduce((n,g)=>n+g.getAttribute(key).array.length,0);
    const merged=new first.array.constructor(total);
    let offset=0;
    for(const g of geos){const arr=g.getAttribute(key).array;merged.set(arr,offset);offset+=arr.length;}

function stableMeleeAttackPoseQ3D(rec,u,rawQ,stage,dt){
 const serial=u.visualAttackSerial||0;
 if(rec.meleeAttackPoseSerial3D!==serial||rec.meleeAttackPoseStage3D==='idle'){
  rec.meleeAttackPoseSerial3D=serial;
  rec.meleeAttackPoseQ3D=Math.max(0,Math.min(1,rawQ));
 }
 const previous=Math.max(0,Math.min(1,Number.isFinite(rec.meleeAttackPoseQ3D)?rec.meleeAttackPoseQ3D:rawQ));
 const target=Math.max(previous,Math.max(0,Math.min(1,rawQ)));

 const maxAdvance=Math.max(.001,dt*(stage==='windup'?3.8:5.6));
 rec.meleeAttackPoseQ3D=previous+Math.min(target-previous,maxAdvance);

function validateC3DModelPack3D(){
 try{
  if(!CX_C3D_MODEL_PACK||CX_C3D_MODEL_PACK.schema!==CX_MODEL_HOST_SCHEMA)throw new Error(`模型接口版本不兼容：A=${CX_MODEL_HOST_SCHEMA}，C=${CX_C3D_MODEL_PACK?.schema}`);
  if(typeof CX_C3D_MODEL_PACK.create!=='function')throw new Error('C3D 模型包缺少 create 模型接口。');
  if(typeof CX_C3D_MODEL_PACK.update!=='function')throw new Error('C3D 模型包缺少 update 动作接口。');
  if(typeof CX_C3D_MODEL_PACK.createProjectile!=='function')throw new Error('C3D 模型包缺少 createProjectile 弹药接口。');
  if(C3D_SOURCE_WALK_PHASE_PER_LOGIC_UNIT!==8.4)throw new Error('迈步频率基线被意外修改');
  const cases=[['blue','melee',false],['red','melee',false],['blue','ranged',false],['red','ranged',false],['blue','tank',false],['red','tank',false],['blue','turret',false],['red','turret',false],['blue','turret',true],['red','turret',true]];
  for(const [team,type,large] of cases){
   const rec=CX_C3D_MODEL_PACK.create(team,type,large);
   if(!rec?.root?.isObject3D||!rec?.actor?.isObject3D)throw new Error(`${team}/${type} 模型缺少有效 root 或 actor`);
   if(type!=='turret'){
    const r=rec.rig;
    if(!r?.pelvis||!r?.torso||!r?.head||!r?.leftLeg?.upper||!r?.leftLeg?.lower||!r?.leftLeg?.foot||!r?.rightLeg?.upper||!r?.rightLeg?.lower||!r?.rightLeg?.foot)throw new Error(`${team}/${type} 移动兵骨架或脚底接触节点不完整`);
   }else if(!rec.rotor?.isObject3D)throw new Error(`${team}/${large?'presetTurret':'turret'} 缺少旋转节点`);
   rec.root.updateMatrixWorld(true);
   let objectCount=0,meshCount=0,invalidTransform=false;
   rec.root.traverse(o=>{
    objectCount++;
    if(o.isMesh)meshCount++;
    const values=[o.position.x,o.position.y,o.position.z,o.scale.x,o.scale.y,o.scale.z,o.rotation.x,o.rotation.y,o.rotation.z];
    if(!values.every(Number.isFinite))invalidTransform=true;
   });
   if(invalidTransform)throw new Error(`${team}/${type} 存在非有限变换值`);
   if(objectCount<4||meshCount<2)throw new Error(`${team}/${type} 模型内容异常为空`);
   const box=new THREE.Box3().setFromObject(rec.root);
   if(box.isEmpty()||![box.min.x,box.min.y,box.min.z,box.max.x,box.max.y,box.max.z].every(Number.isFinite))throw new Error(`${team}/${type} 包围盒无效`);
  }
  c3dModelPackHealthy=true;c3dModelPackError='';return true;
 }catch(err){setC3DModelError3D(err,{fatal:true});return false;}
}

// D0009 环境NPC模型 DrawCalls/减面优化辅助函数（从 D0009 母版同步）
function d0002MergeGeometries(geometries){
 const geos=geometries.map(g=>g.index?g.toNonIndexed():g.clone());
 if(!geos.length)return null;
 const out=new THREE.BufferGeometry();
 for(const key of ['position','normal','color']){
  if(!geos.every(g=>g.getAttribute(key)))continue;
  const first=geos[0].getAttribute(key),total=geos.reduce((n,g)=>n+g.getAttribute(key).array.length,0);
  const arr=new first.array.constructor(total);let off=0;
  for(const g of geos){const a=g.getAttribute(key).array;arr.set(a,off);off+=a.length;}
  out.setAttribute(key,new THREE.BufferAttribute(arr,first.itemSize,first.normalized));
 }
 if(!out.getAttribute('normal'))out.computeVertexNormals();
 return out;
}

function d0002BakeStaticMesh(mesh,root){
 let geo=mesh.geometry.clone();if(geo.index)geo=geo.toNonIndexed();
 root.updateMatrixWorld(true);mesh.updateMatrixWorld(true);
 const rel=new THREE.Matrix4().copy(root.matrixWorld).invert().multiply(mesh.matrixWorld);geo.applyMatrix4(rel);
 for(const key of Object.keys(geo.attributes))if(key!=='position'&&key!=='normal')geo.deleteAttribute(key);
 if(!geo.getAttribute('normal'))geo.computeVertexNormals();
 const mat=Array.isArray(mesh.material)?mesh.material[0]:mesh.material;
 const color=(mat&&mat.color)?mat.color:new THREE.Color(0xffffff);
 const count=geo.getAttribute('position').count,colors=new Float32Array(count*3);
 for(let i=0;i<count;i++){colors[i*3]=color.r;colors[i*3+1]=color.g;colors[i*3+2]=color.b;}
 geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
 return geo;
}

function d0002BatchStaticObstacle(root,{name,roughness=.9,metalness=.01,flatShading=false}={}){
 root.updateMatrixWorld(true);
 const meshes=[];root.traverse(o=>{if(o.isMesh)meshes.push(o);});
 const merged=d0002MergeGeometries(meshes.map(m=>d0002BakeStaticMesh(m,root)));
 for(const m of meshes)if(m.parent)m.parent.remove(m);
 const mat=new THREE.MeshStandardMaterial({color:0xffffff,vertexColors:true,roughness,metalness,flatShading,side:THREE.DoubleSide});
 const batch=new THREE.Mesh(merged,mat);batch.name=name;batch.castShadow=true;batch.receiveShadow=true;
 batch.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,side:THREE.DoubleSide});
 root.add(batch);root.updateMatrixWorld(true);return batch;
}

function d0003BatchSelectedMeshes(root,meshes,{name,roughness=.8,metalness=.15,flatShading=false,transparent=false,opacity=1,emissive=0x000000,emissiveIntensity=0}={}){
 root.updateMatrixWorld(true);
 const valid=meshes.filter(m=>m&&m.isMesh);
 if(!valid.length)return null;
 const merged=d0002MergeGeometries(valid.map(m=>d0002BakeStaticMesh(m,root)));
 for(const m of valid)if(m.parent)m.parent.remove(m);
 const mat=new THREE.MeshStandardMaterial({
  color:0xffffff,vertexColors:true,roughness,metalness,flatShading,side:THREE.DoubleSide,
  transparent,opacity,emissive,emissiveIntensity,depthWrite:!transparent
 });
 const batch=new THREE.Mesh(merged,mat);batch.name=name;batch.castShadow=true;batch.receiveShadow=true;
 batch.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,side:THREE.DoubleSide});
 root.add(batch);root.updateMatrixWorld(true);return batch;
}

function d0003OptimizeDroneDrawCalls(group,rotors){
 group.updateMatrixWorld(true);
 const rotorMeshSet=new Set();
 for(const rotor of rotors){rotor.traverse(o=>{if(o.isMesh)rotorMeshSet.add(o);});}
 const allMeshes=[];group.traverse(o=>{if(o.isMesh)allMeshes.push(o);});
 const glassMeshes=allMeshes.filter(m=>{
   const mat=Array.isArray(m.material)?m.material[0]:m.material;
   return !!(mat && (mat.transparent || m.material.opacity<1));
 });
 const opaqueMeshes=allMeshes.filter(m=>!rotorMeshSet.has(m) && !glassMeshes.includes(m));
 d0003BatchSelectedMeshes(group,opaqueMeshes,{name:'DroneBatch_Body',roughness:.66,metalness:.42,flatShading:false});
 d0003BatchSelectedMeshes(group,glassMeshes,{name:'DroneBatch_Glass',roughness:.12,metalness:.08,transparent:true,opacity:.82,emissive:0x264458,emissiveIntensity:.16});
 rotors.forEach((rotor,i)=>{
   const rotorMeshes=[];rotor.traverse(o=>{if(o.isMesh)rotorMeshes.push(o);});
   d0003BatchSelectedMeshes(rotor,rotorMeshes,{name:`DroneBatch_Rotor${i}`,roughness:.50,metalness:.18});
 });
 group.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;}});
 group.updateMatrixWorld(true);
}

function d0004OptimizeBalloonDrawCalls(group,envelope,envelopePivot,basketPivot){

   const mat=Array.isArray(m.material)?m.material[0]:m.material;
   return !!(mat && mat.map);
 });
 const collarMeshes=envelopeMeshes.filter(m=>m!==texturedEnvelope);
 if(collarMeshes.length)d0003BatchSelectedMeshes(envelope,collarMeshes,{name:'BalloonBatch_Collar',roughness:.92,metalness:.02});
 const rootMeshes=collect(group).filter(m=>!envelopeMeshes.includes(m) && !basketPivot.children.includes(m) && !basketPivot.getObjectById(m.id));
 // 排除 basketPivot 子树：只保留绳索与中部金属环

function createRingShape3D(outerRadius,innerRadius,startAngle=0,theta=Math.PI*2){

function applyPveAiPreBattleDeployment(){
 if(clientMode!=='pve'||!pveStartCountdownActive)return;

 if(pvePreBattleDeployments.some(r=>r.team===team))return;
 const red=team==='red';

 const rows=red?[
  {type:'melee',cell:[5,ROWS-3]},
  {type:'ranged',cell:[9,ROWS-3]},
  {type:'tank',cell:[15,ROWS-3]}
 ]:[
  {type:'melee',cell:[5,2]},
  {type:'ranged',cell:[9,2]},
  {type:'tank',cell:[15,2]}
 ];
 for(const row of rows){
  const cost=deploymentModeCost(row.type,'slow');
  if((teams[team]?.energy||0)>=cost){
   const u=instantiatePreBattleDeployment({team,type:row.type,cell:row.cell,mode:'slow'});

  }

 }
 const totalW=Math.max(cell,cursor-(value?cell:0));
 const offsetX=-totalW*.5+cell*.5,offsetY=-maxH*.5+cell*.5;
 glyphGroup.children.forEach(voxel=>{voxel.position.x+=offsetX;voxel.position.y+=offsetY;});
 const glowPlate=new THREE.Mesh(new THREE.PlaneGeometry(totalW+cell*1.6,maxH+cell*1.4),pveStartCountdown3DBackdropGlowMaterial);
 glowPlate.position.set(0,0,-cell*.78);glowPlate.renderOrder=-2;glyphGroup.add(glowPlate);

}

log('S0005-0184：修复火球焦痕余烬长期呈扁椭圆的问题。根因是焦痕母平面原为1.02×0.82且纹理算法多处对Y轴使用0.68～0.82压缩；现改为近各向同性的不规则焦斑与随机裂纹/热点，并将焦痕母平面约束为0.96×0.96世界单位（2.88×2.88格）、余烬为0.88×0.88，取消母平面旋转，保证轴对齐外包矩形不超过3×3格。其余S0005-0183规则保持不变。','gold');
log('S0005-0185：调整PVE开战倒计时与Ready按钮布局：倒计时数字下沿固定距北侧河岸约2格；【准备好了点这里】移至数字正下方，高度按屏幕投影动态设为约1.5格；倒计时剩余3秒起按钮强制隐藏，玩家点击Ready后也立即隐藏。其余S0005-0184战斗规则不变。','gold');
log('S0005-0186：修正双方Ready后的开战流程：双方都准备完成时不再立即开战，而是将剩余战前准备时间直接压缩到最后3秒，完整显示3、2、1并播放现有最后三秒提示音，归零后才进入T0正式开战；Ready点击后仍立即隐藏按钮，并在这3秒内锁定战前部署与将领选择。其余S0005-0185规则不变。','gold');
log('S0005-0187：修复同队重装兵绕过正在拆建筑的前车后，接近同一建筑却可能停住发呆的问题：旧动态绕行将前车额外膨胀0.24格，而全局真实单位接触余量仅0.04格，导致绕行过宽；更严重的是，后车若被碰撞/建筑纠偏轻微推回该动态包络内，连续寻路要求起点必须在包络外，因而会得到Infinity路线并清空目标。现将攻城前车动态绕行余量收紧为0.08格，并允许已处于包络边缘内的后车仅沿单调远离前车的线段逃出，再重新接管建筑目标；禁止向内或穿越前车。其余S0005-0186规则保持不变。','gold');
log('S0005-0188：将PVE战前【准备好了点这里】按钮由深黑蓝次级按钮配色改为项目统一的#FFD35A黄色主操作按钮，文字改为深色并增加轻微黄色外发光；仅修改视觉层级，Ready显隐、最后3秒倒计时与战斗规则完全继承S0005-0187。','gold');
log('S0005-0195：补齐真人联机的两处输入缺口。其一，战旗松手后不再清空画面等待服务器回环：本机立即以纯视觉预测态显示3D战旗、地面倒计时圆环与数字，服务器serverSeq/applyTick到达后无缝交给权威windup，伤害/生效时刻仍只认服务器统一Tick。其二，匹配成功至T0之间正式开放绿色战前部署：本方操作通过服务器顺序广播确认，双方客户端按同一serverSeq建立冻结T0布阵，敌方位置T0前隐藏；战前消耗独立100能量，T0恢复50封顶100。为避免未实现的赛前撤回协议造成分叉，联机本版战前部署只允许新增，不开放PVE的撤回/重置；PVE既有逻辑不变。','gold');
log('S0005-0196：修复联机三项状态机缺口：①战旗本地预测交接权威windup时不再用max进度产生约120度后的停顿，改为从交接角度连续映射剩余权威进度；②联机正式战斗的单位卡恢复直接拖拽，移动超过8px即以普通档进入落点拖拽，点击/长按仍可选择其它部署档；③联机匹配不再显示红蓝色旧5秒StartGate，而是双方基于同一服务器startAt统一顺延25秒，使用与PVE一致的中性30秒战前部署倒计时、绿色战前部署和将领选择，T0前敌方布阵继续隐藏。','gold');
log('S0005-0197：补齐联机30秒战前阶段的【准备好了点这里】按钮：移除online模式CSS强制隐藏与PVE-only显隐门槛；联机点击Ready后本方按钮立即隐藏并锁定将领/战前部署，同时Ready状态通过服务器serverSeq广播。双方Ready均由服务器确认后，以第二个Ready事件的统一服务器时间锚点把原30秒窗口压缩到最后3秒，完整显示3、2、1后再进入T0。PVE原Ready逻辑保持不变。','gold');
log('S0005-0198：修复所有模式战旗倒计时地面圆环不接收投影的问题：战旗圆环base/progress与单位部署圆环统一启用receiveShadow且不投射自身阴影。并进行联机前台统一手术：联机与PVE共用战场/左栏布局、战前减号撤回、战前单位拖动重置、上次/上上次布阵、正式战斗三档卡牌交互、30秒倒计时、Ready、将领与战旗前台；仅保留网络状态、真人不可本地暂停/改速、敌方隐藏信息和服务器权威同步等联网必需差异。','gold');
log('S0005-0203：修复战前部署阶段敌方预部署单位虽然3D本体隐藏、但二维血条和状态图标仍提前暴露的问题。根因是S0108以来隐藏判断只存在于syncUnits3D，没有同步到drawUnits二维覆盖层。现新增统一preBattleEnemyUnitHidden判断，3D本体与二维血条、攻击间隔、减号、将领/状态图标等附属表现共用同一可见性规则；战前敌方预部署单位整套不可见，T0后统一揭晓。其余S0202逻辑保持不变。','gold');
log('S0005-0217：修复S0216宽门户的过期入口回抓。桥入口不再是可把单位吸回身后的硬航点：跨河路径按纵向进度前向单调，一旦越过本侧入口平面，该入口永久从本次路径中废弃；桥内只继续前往对侧出口。同步废弃S0126射手桥头逆追索敌限制，桥区不再修改普通目标合法性。普通移动统一为：连续配置空间寻路＋有限宽度桥几何＋实体接触后的圆形碰撞/质量分离；不启用桥头排队状态机、桥口双向预对齐、让路协商、拒绝改道或未接触友军预测避碰。','gold');
log('S0005-0227：单位移动系统完成稳定意图重构。删除桥头排队/让路/协商/拒绝改道/固定入口、敌方桥头禁驻、射手桥头逆追限制、旧轻兵侧绕器、旧重装攻城动态绕车、最后侧塔直线特判等历史交通体系；桥仅作为河水静态障碍中的普通缺口。正常移动改为：静态配置空间A*提供稳定全局意图，静态目标仅在目标/拓扑/路径实际失效时重规划，移动目标低频刷新；友军局部接触只做连续相对速度非穿透，真实重叠只做统一圆形质量分离，碰撞纠偏不再自动废弃全局路径。射手最小射程脱离、重装破阵击退、目标优先级等既定玩法机制保留。','gold');
log('S0005-0229：修正近战举剑起步短暂停顿，并将下砍改为明显更快的爆发段。举剑从攻击起始相位立即连续发生，最高点唯一；下砍压缩到 q=.58→.70，并增加短促披风冲击反馈；不改变攻击判定、命中时刻、伤害、冷却或移动系统。','gold');
log('S0005-0233：完整继承S0232权威移动/战斗逻辑，仅重构非权威表现层。3D单位位置、朝向与附属血条在上一权威状态与当前权威状态之间按渲染帧插值，步行动画由插值后的视觉位移推进。S0234起权威时间恢复为真实60Hz，但该插值层继续用于高刷新率屏幕。','gold');
log('S0005-0234：彻底移除历史全局战斗时间倍率。1真实秒=1模拟秒=60 Tick；旧版墙钟节奏已离线重标定进速度、攻击间隔、转身、前摇、炮台寿命、AI窗口、战旗与视觉权威环境参数。旧记录仅在载入边界按自身时间元数据一次性迁移Tick，主战斗内核、联机时钟、Seek与新记录不再存在双时间权威。','gold');
log('S0005-0236：友军局部避让改为方向连续性求解。两侧均可行时优先保持上一Tick真实运动方向，只有当前侧真正失去几何可行性才切换；pairSide仅用于首次完全对称破缺。消除双单位并行进入窄通道时约40°逐Tick左右翻号，不增加任何桥头/兵种特判。','gold');
log('S0005-0237：修复重装兵抵达预置炮台脚下却不攻击。根因不是死亡目标引用残留——炮台死亡时clearDeadUnitReferences已统一清除target/attackTarget；真正问题是统一连续寻路终点净距0.12格大于重装真实锤击距离0.10格，特定几何下单位会精确停在射程外0.02格。现将统一、与兵种无关的近目标规划净距收紧至约0.08格，保持不重叠并确保最短攻击距离单位也能自然进入真实攻击圈，不增加预置炮台或重装专用特判。','gold');
log('S0005-0239：修复模拟模式战旗HUD自始至终灰显。根因是updateBattleFlagUI把“不可操作”写入button.disabled，而CSS又把:disabled与.used共用灰度样式，导致模拟模式虽正确读取battleFlagInventory，仍因只读权限被伪装成“已使用”。现彻底解耦HUD显示状态与交互权限：used/pending仅由权威战旗库存与部署状态驱动；disabled仅阻止输入，不再改变视觉。模拟模式未使用战旗正常彩色、部署中显示pending、已使用才灰显，并继续随观察方阵营切换。','gold');
log('S0005-0240：重构移动单位质量分离层级。轻兵之间继续按质量反比分配碰撞位移；重装与任意非重装发生接触时，重装被动碰撞位移固定为0，全部分离位移由轻兵承担；重装与重装仍保留相互推挤。由此近战/射手不再能改变正在攻击建筑的重装站位或扰乱攻击节奏；未增加“攻击建筑中的重装”局部免推特判。','gold');
log('S0005-0241：修复桥口同向交通前后车路权颠倒。旧闭合责任在两条路径向狭口收束时，会因双方preferred velocity都含横向汇入分量而把先到前车误判为共同闭合责任者，导致前车先减速/排队，后车追上后再触发质量分离。现新增与兵种、桥无关的同向纵向次序判定：同向且前后明确时，前车避让责任固定为0、后车固定为1；仅并列/迎面/交叉继续使用原互惠避让。','gold');
log('S0005-0244：重装兵双锤攻击轨迹改为向身体中轴线斜劈。保留原左右锤时序与前后俯仰，下落段加入镜像横向内收：左锤向右前下、右锤向左前下；举锤阶段仅轻微外展，避免头顶互穿。只修改3D动作表现，不改变攻击前摇、命中时刻、伤害、射程或碰撞。','gold');
log('S0005-0246：修复S0245导致的桥头路权回归。S0245错误地把“重装不被轻兵实体推挤”扩展成“重装对轻兵永不承担交通让行”，使后到重装获得事实上的绝对路权，先到近战又会停下让路。现将交通次序与物理推挤彻底解耦：明确前后关系先按先到先行裁决；若重装是后车、轻兵是前车，重装只做纵向减速/排队，禁止横向绕行；实体接触层仍保持重装坐标不被轻兵改变。无明确前后关系的混战继续执行S0245重装责任0/轻兵责任1，避免重装“落叶漂移”。','gold');
log('S0005-0245：修复激烈混战中重装兵可被友军轻兵像落叶一样反复漂移。根因是S0242把同队“后车承担全部避让/接触纠偏”放在S0240重装抗轻兵层级之前：重装一旦被判为后车，速度层会自行侧闪/排队，接触层还会直接修改其坐标，从而打穿“只有重装才能移动重装”的既定规则。现将重装↔轻兵层级提升为速度与实体接触两层的最高优先级：友军局部交通中重装责任恒0、轻兵恒1；真实接触中重装位移恒0、轻兵承担100%分离。前后车规则仅在轻兵↔轻兵或重装↔重装内部生效。敌方轻兵仍可通过真实前向阻力减慢重装并触发破阵，但不能产生横向搬运。','gold');
log('S0005-0243：【火球的余烬】呼吸表现改为定尺寸亮度呼吸。删除余烬每帧scale正弦胀缩；每次命中生成时确定的基础尺寸全生命周期保持不变，仅通过Additive材质opacity做平滑忽明忽暗。火球飞行、爆炸、焦痕、黑烟、伤害与战旗裁判均不改变。','gold');
log('S0005-0242：纠正S0241无效修复。S0241只在两车preferred velocity夹角满足sameFlowDot=.58时判前后，桥口大角度汇流可直接漏判；且帧末S0240质量分离仍会让重装位移0、轻兵承担100%，从而覆盖速度层路权。现删除夹角前置条件，改用双方各自前进轴上的双向纵向投影识别明确前后；同时同队实体接触层也继承同一先后次序，明确后车只做自身回退，禁止帧末接触把先到前车挤到后面。迎面/交叉/并排及敌我接触仍保留原互惠避让与S0240重装抗轻兵层级。','gold');
log('S0005-0238：继续修复重装兵在残血预置炮台前发呆。S0237只修了理论规划终点，却遗漏两处“最终航点提前到达”容差：建筑最终点可在离航点0.035格时被删除，令0.08格理论净距实际最坏变为0.115格，仍超过重装0.10格真实攻击距离。现取消建筑最终接敌点的距离式提前完成；最终段必须持续保留并推进，直到updateUnits以真实targetDistance<=attackReach判定进入攻击状态。移动目标与普通折点阈值不变，不增加兵种/炮台特判。','gold');
log('S0005-0247：增强重装拆建筑与核心受击反馈。重装双锤在真实命中炮台的结算帧，从受击面喷出9块短寿命砖屑，带外喷、横向散射、抛物线高度、旋转与落地淡出；碎砖仅走sparks表现层，不参与碰撞、伤害、Hash或目标逻辑。核心被任何攻击命中时改用独立coreHit声纹：短促硬质裂响叠加低频结构震颤，并加入105ms最小触发间隔；核心伤害、死亡结算与coreDestroy音效不变。','gold');
log('S0005-0248：重做重装砸炮台的可见性。S0247碎砖仅约0.03–0.06旧格宽且寿命0.66秒，实战缩放后容易淹没在模型中；现提升为14块约0.06–0.11旧格宽的高对比砖块，延长至0.96秒并显著提高外喷/侧喷速度，同时在命中瞬间叠加5团短促灰尘冲击云。仍只在真实重装→炮台伤害结算帧触发，不参与任何战斗判定。','gold'); log('S0005-0249：重做重装双锤砸炮台反馈。删除S0248的14块二维大砖与尘云，参考核心被打爆改为每个锤头4块更小的3D刚性碎块，使用强外喷、重力下落与三轴自转。反馈不再错误绑定唯一伤害结算帧，而是严格跟C3D双锤动作相位：左锤在windup约77.08%落点触发，右锤在recoil约74%落点触发；两锤各自播放一次tankHammerHit砸砖石声。战斗伤害仍只结算一次，攻击周期与DPS完全不变。','gold'); log('S0005-0250：按实战观感重做双锤碎砖轨迹。S0249每块碎砖都叠加共同forward基速度，导致视觉形成向前流淌的砖流；现彻底删除forward主轴。每锤碎砖由4块减为3块，单块三轴尺寸约放大2倍，并按三个不同径向扇区以0.96–1.44世界单位/秒的爆速四散放射、明显上抛、重力坠落和三轴自转；右锤径向相位再错开60°，两次命中合起来呈零星爆炸式四散而非同向喷流。左右锤双击音与唯一伤害结算保持不变。','gold'); log('S0005-0253：稳定停驻友军近接触允许真实圆周切向绕行，修复追敌单位顶住同伴侧面零进展卡死。','gold'); log('S0005-0255：修复多个稳定停驻友军并排时的近接触切向抖动。根因是S0253/S0254仍逐邻居独立求±90°切线：移动单位紧贴两个并排停驻者时，左邻居与右邻居会在同一Tick依次覆盖resolved velocity，微小几何变化又会在后续Tick反转最终方向，形成左右抢方向盘。现将两个及以上近接触stableStop友军先合并为局部障碍簇，只围绕簇左右最外缘各求一次外侧切线；选定一侧后整簇只输出一个速度方向，若两侧均无前向且合法的空间则统一排队，障碍簇成员不再进入逐成员切线。单个停驻友军仍继承S0253切向绕行。','gold');
log('S0005-0256：按CR式“提前感知、稳定可预测”原则重构友军局部交通。撤下S0253单stableStop±90°切线与S0255多stableStop障碍簇两套补丁，也删除逐邻居顺序覆盖resolved velocity的执行方式。现每Tick只围绕全局preferred velocity生成固定、确定性的方向/速度候选，并同时对全部邻近友军做未来圆形碰撞预测：先选碰撞风险最低者，再以最小转向、最小减速、与上一帧方向连续性作为次级成本。明确前后次序仅分配让行责任，不直接规定左右；停驻者可被自然绕行，移动前车优先由后车减速跟随；重装↔轻兵实体层级保持独立。桥仍只是静态几何，不再追加桥头防抖特判。','gold');
log('S0005-0257：修复S0256在汇流窄口重新出现“先到轻兵给后到重装让路”。根因是旧路权只承认双方前进轴都一致判定前后；两路向同一窄口汇入时常退化为无序关系，随后重装质量层级错误接管交通路权。现统一为三层不变量：先求占位/冲突点到达次序，先到者路权不可被兵种质量推翻；无明确路权时质量仅作次级避让；候选速度最后裁决。新增通用意图射线冲突点ETA，适用于桥口、门洞、建筑夹缝和任意两路汇流，不增加桥/兵种特判。','gold');
log('S0005-0258：修复S0257仍会出现“前车给后车重装让路”的跨层路权回归。根因有两层：其一，S0257仍可能在斜向同流汇入时丢失前后次序；其二更关键，帧末重装↔轻兵接触仍先执行S0245绝对质量分离，后到重装一旦追尾即可保持自身不动并把前车轻兵沿接触法线挤开，直接推翻速度层路权。现将路权升级为跨层硬约束：同一总体流向用共享流向轴判定前后，真交叉才用冲突点ETA；速度层明确前车完全忽略后车、后车禁止在预测窗内越过前车；接触层明确路权先于质量，发生追尾只允许后车沿自身本帧驶入轨迹/反向preferred速度回退，绝不移动前车。只有无明确路权时才执行重装不被轻兵推动的质量规则。','gold');
 log('S0005-0259：修复S0258后蓝重装在桥头长时间卡死、偶发抖动的结构性回归。S0258把任何夹角<90°的同向/斜侧邻居都纳入共享轴前后车判定，并在接触层让后车沿自身轨迹/反向preferred轴持续回退；大体型重装在桥头同时面对斜侧友军与静态边界时，容易形成“速度层前进→接触层回退→下一Tick再前进”的零净位移循环。现删除接触层持续回退能力：同流前后车必须同时满足方向相近、横向处于同一局部走廊且纵向差足够；走廊外汇流统一交给冲突点ETA。明确路权接触只冻结前车并把后车做最小合法非穿透投影；仅在最近投影被静态几何阻挡时才退到本Tick首次接触点，绝不继续沿preferred轴倒车。速度层负责绕行/排队，接触层恢复为纯几何约束。','gold');
log('S0005-0260：按CR公开Pathfinding“提前看见障碍、减少lane依赖、移动更一致可预测”的原则重构拥堵导航。根因不是桥头某个局部规则，而是S0227以来全局A*明确排除动态单位，导致后排永远不知道前方已经堵成团，只能等进入0.7~0.8格局部避让范围后减速/抖动。现保留唯一静态配置空间A*作为拓扑骨架，在同一5×5子格上新增同队动态拥堵软成本场：正常移动友军只产生很低成本，低速/停驻/成团单位成本连续叠加；后排每约0.22秒前视3.6格，真实低进展或前方成本超阈值时才触发拥堵重规划；非卡死状态的新路线还必须至少降低6%动态成本，并获得1.15秒路径承诺，防止对称拥堵下左右/换桥反复投票。友军从不成为硬墙，有空间则A*提前斜向绕开或换更便宜通路，无替代路才自然排队。局部速度层删去80/90度大绕行候选，降级为短视距微观避碰；接触层仍只做路权约束与最小非穿透，不再承担导航。','gold');
log('S0005-0263：依据S0005-0262联机记录ONLINE-CX_000107_4D1506-20260906213337-T00547实测修复“动态A*已绕路、执行器却重新直冲人群”的规划/执行断层。T330后蓝近战的动态路径已经明确右绕至(15.3,19.3)→(15.5,19.9)，但mobileContinuousWaypoint仍只检查静态配置空间，因远端目标静态直达而跳过这两个动态绕行节点，使preferred velocity继续近乎正北冲向两名停驻射手，局部层只能queue为0速度。现统一动态成本语义：新增mobileCrowdSegmentTravelCost作为A*后处理、路径成本与执行lookahead的共用度量；congestionPath执行时只有直线捷径的动态成本不高于正式绕行段才允许跳节点，否则必须跟随动态绕行折点。拥堵消散后直线成本自然下降，可自动恢复自然斜行；没有桥、射手、近战或双单位专用规则。','gold');
log('S0005-0264：依据历史记录PVE-20260906145919-T07949在当前S0263规则上复现并修复“桥头射手永久path-segment-invalid，随后重装被同处拥堵拖死”。T3540审计显示蓝射手#26位于(3.741,15.058)，无友军邻居、无接触修正、preferredSpeed=1.885却actualSpeed=0，congestionReplanCount持续上升；实时A*可正确给出首节点(3.9,15.3)，距当前位置仅约0.289格。旧advancePassedPathNodes以da<0.30盲删该关键配置空间入口节点，导致下一远端节点从当前位置斜切河岸角而非法，路径随即清空，下一Tick重新生成同一入口再被删除，形成永久循环。现新增mobilePathNodeSkipLegal：任何近距离/已越过节点只有在删后到下一节点的连续配置空间线段仍合法时才可跳过；动态拥堵路径还要求直达动态成本不高于经原节点的成本。该规则适用于桥口、门洞、建筑角与所有配置空间网关，无桥/兵种特判。','gold');
log('S0005-0455：部署经济与前摇统一收口到唯一 DEPLOY_MODE_RULES：每个单位×档位在同一对象项内同时保存seconds与cost。默认3档正式数值为近战5/12、2/22、1/35；射手7/22、3/33、2/45；重装11/40、6/60、3/95；炮台9/25、4/40、2/65。HUD速读、部署预检、PVE AI、模拟回放、联机预显/落地、实际扣能与实际前摇均只读该表；删除TYPE基础费用、MODE倍率与WINDUP第二套部署公式。玩法规则变更，CX_RULE_VERSION同步升级为S0005-0455。','gold');

log('S0005-0302：射手撤退完成自审收敛：删除3格普通/5格多威胁双预算与代表威胁ID，单/多威胁统一使用同一32方向逃生求解器和同一5格连续遭遇局部活动圆；方向求解与撤退A*都受该圆约束。活动圆耗尽或真实无进展会把本次遭遇标记为已解决，后续挨刀不得再次启动第二轮逃跑，直到全部近接触移动威胁真正持续离场后才重置。旧恢复炮台字段、战后前进空状态及其遗留参数同步清除。','gold');
log('S0005-0300：修复射手在多名敌方移动单位近身包围时的原地大幅摆头。根因是统一0.10秒索敌会在多个同级贴身目标间反复换锁，每次换锁都让撤退方向与detour翻转；同时再次挨刀与成功重规划会清零rangedRetreatBlockedTime，而turningOnly分支还会持续回退受困计时，导致射手即使真实零位移也永远进不了受困反击。现改为：撤退期间锁住当前移动威胁直到其死亡/失效；3格预算按整个连续近接触遭遇共享，多个敌兵轮流成为最近目标不得刷新；再次挨刀/重规划不再清零受困计时；新的近战命中若当前已有存活移动目标，只打断动作而不抢锁；并把上一Tick真实前向位移形成的congestionBlockedTime纳入受困判定，约0.55秒持续无进展后停止逃跑并承诺原地反击。无桥/阵营/三面包围特判。','gold');
log('S0005-0265：针对联机记录ONLINE-CX_000107_4D1506-20260906213337-T00547中“西侧蓝射手过桥后向北移动时持续摆头/抖动”继续清理局部交通执行层。S0256以来的离散速度采样把risk作为近乎零容差的第一排序键，+/-侧候选只要因相对位置或浮点变化出现1e-8级风险差就可逐Tick换侧；同时continuity读取lastMoveAngle，而lastMoveAngle会在候选尚未真正执行时立即被新请求方向覆盖，因此并不能代表真实运动惯性。现改为两级安全裁决：只要存在零预测碰撞候选，严格只在零风险集合中竞争；若所有候选均有风险，则只有风险改善超过0.045才值得牺牲方向连续性。连续性第一来源改为上一Tick实体接触修正前真正执行过的自驱位移frameSelfDx/Y，避免请求方向和外力位移污染。该规则作用于所有移动单位、所有地形，不含桥/射手特判。','gold');
log('S0005-0267：依据历史记录PVE-20260906145919-T07949在当前S0266规则上复现“约18秒蓝重装抵达红东预置炮台后缓慢左右摆动并永久停在射程外”。重放显示蓝重装#6在T1080 targetDistance=0.1522、attackReach=0.10、最终路径点仅约0.075格远；T1140停在targetDistance=0.1322、仍差约0.0322格，但局部交通因附近友军存在而进入queue。根因是solveFriendlyLocalVelocity固定用约0.30格静态方向探针，远超当前最终路径段剩余长度；探针越过合法接敌点进入炮台碰撞体，导致所有非零前进候选被误判静态非法。现将局部静态方向探针统一裁剪到当前正式route point剩余距离；友军TTC/圆形碰撞预测时间窗不变。该规则同时适用于建筑接敌、门洞、配置空间转角和任意短路径段，无桥/炮台/兵种特判。','gold');
log('S0005-0268：清理已废弃的移动阻力提示表现与对应死遥测。审计确认该提示仅属于旧UI，不参与寻路、避让、路权、碰撞、攻击或任何战斗裁判；三个历史单位遥测字段也已无运行时读取，只造成快照与Hash冗余。现删除整套提示绘制与血条调用，并删除对应单位状态字段、初始化、每帧写入/清零及公开快照数据。真正仍生效的敌方正面实体阻力计算继续保留，减速玩法不变。','gold');
log('S0005-0270：修正S0269核心血条锚定错误。S0269把血条冻结在S0268旧绝对屏幕投影，导致顶部战场扩展后核心本体随当前相机移动、血条却不随核心移动，视觉间距被拉大。现彻底移除旧相机框架/16px补偿投影，恢复S0268核心血条原始相对锚定公式：血条与核心本体共同使用当前相机投影及当前格尺度，因此HUD去框与顶部战场扩展继续保留，而核心—血条视觉间距恢复S0268关系。仅UI显示修正，权威规则版本继续沿用S0005-0268。','gold');
log('S0005-0271：再次纠正核心血条位置。对用户提供的S0268/S0269对比截图进行像素级核心本体对齐后确认：核心模型本体位置基本未变，血条单独向屏幕下方偏移了精确16px；S0270恢复相对0.42格锚定因此不会改变该16px偏移。现保留S0269顶部战场扩展与HUD去框，只在核心血条最终Canvas screen-space Y上统一减16px，精确恢复S0268旧屏幕位置。该16px对应被删除的HUD外层7+7px垂直padding与1+1px边框。仅UI绘制修正，权威规则仍为S0005-0268。','gold');
log('S0005-0278：测试性隐藏紫色ultra部署选项。正式战斗玩家HUD的速度色条、长按部署弹窗与卡牌费用区间均只显示橙/黄/绿三档；ultra模式定义、成本、前摇、联机/回放解析及历史记录显示全部保留，未删除任何规则代码。权威规则版本仍为S0005-0268。','gold');
log('S0005-0282：修复模拟模式暂停后向过去时间定位时，箭雨飞箭/插地残箭等未来瞬态视觉跨越回退边界残留。根因是确定性快照只恢复权威战斗态，而箭雨残箭、结束落地箭、火球焦痕、重装砸塔碎砖、炮台沉降/残塔等纯表现缓存不进入快照，旧对象因此继续挂在3D场景。现建立统一状态恢复边界：任何权威快照恢复后，所有非权威瞬态表现缓存统一失效并清空，下一帧只能依据恢复后的权威状态重新派生；不再对箭雨单独打补丁。该修改只影响表现层与回退显示，CX_RULE_VERSION继续为S0005-0281。','gold');
log('S0005-0283：左侧双方操作队列加入战旗时间事件。PVE实时battleFlagHistory、模拟记录flags/recordBattleFlagActions以及联机服务器战旗广播统一映射为与单位部署同源的时间行，并按Tick排序；战旗行显示箭雨/火球图标、操作时间与坐标，坐标底板严格使用蓝#3e9cff/红#ff4f58阵营标志色，单位部署坐标仍保留橙/黄/绿速度色语义。纯UI/记录展示修改，CX_RULE_VERSION继续为S0005-0281。','gold');
log('S0005-0287：修复射手最小射程撤退在友军反向拥堵前只会原地摆动、不会利用开阔侧向空间。根因是撤退全局Dijkstra长期只读取静态配置空间，反复选择几何最短的纯反向路线；友军只交给局部速度层处理，而局部层按设计最多±65°微避碰，不能承担近90°的大范围侧撤。现将撤退全局路线接入与普通移动完全相同的动态软拥堵场：友军仍非硬墙，但低速/停驻/成团会增加路径成本；安全距离终点按动态旅行成本选择，动态成本同时进入路径平滑，保证稍远但畅通的侧向路线不会被重新拉直穿过人群。无桥、河岸、红蓝方或具体兵种组合特判。','gold');
log('S0005-0288：顶栏阵营按钮统一为【你是X方】：PVE去掉PVE前缀；模拟模式新增同一按钮并取代右栏【双方交换】。模拟观察方只改变视图与信息归属，不改写战斗事实；新载入JSON不再覆盖redAtBottom，始终强制按顶栏当前红/蓝方显示。右栏【双方交换】按钮及其事件绑定永久移除。纯UI/观察层修改，CX_RULE_VERSION继续为S0005-0287。','gold');
log('S0005-0289：模拟模式启动及从其他模式切回时统一默认蓝方上北下南视角。PVE/联机顶栏新增3/4档部署速度按钮，默认3档；3档从实时玩家入口与PVE AI候选层共同禁止紫色ultra，4档恢复。模拟载入JSON时优先按实际部署动作是否出现ultra识别3/4档，并以显式档位元数据作备用；底部4张单位卡的速度底边与只读弹层统一按N档动态显示。该修改改变PVE AI可选部署动作，因此CX_RULE_VERSION升级为S0005-0289。','gold');
log('S0005-0295：重装兵不再优先盯普通炮台。删除普通炮台软优先、最后预置炮台优先、近身建筑承诺以及跨建筑路线成本抢锁门槛；重装全局收集所有可达敌方建筑（普通炮台、预置炮台、核心），同级按当前实体边缘距离选择最近目标。路径成本仅负责可达性过滤，不参与建筑类别排序；重装拦截将领对敌重装的特殊高优先任务保持不变。','gold');
log('S0005-0296：修复静态建筑“旧接敌点永久冻结”。根因是staticTargetReplan=Infinity把建筑圆心不移动误等同于路径末端不需要更新，单位绕过死亡炮台等静态障碍后仍奔向数秒前选中的旧建筑表面点。现将目标建筑身份与表面接敌点分层：仅在距建筑8格实体净距内、旧末端相对当前径向最近接敌点漂移超过0.24格时，以约0.32秒低频探测；当前径向点一旦静态直达便直接替换路径末端，仍受障碍阻挡则保持原绕行，不周期重跑A*；远程行军不探测，建筑目标本身不因此换锁。','gold');
log('S0005-0290：三模式战场/HUD几何正式收束为统一基线。根因是旧fitCameraToStage按当前模式实时DOM高度推导bottomInset，使模拟/PVE/联机的只读、战前或功能差异有机会反向改变棋盘垂直构图。现底部HUD固定共用69px高度、8px底距、3px相机安全距，相机只认这套canonical几何；模式仅保留交互/可见/禁用能力差异。观察方切换也立即重算同一相机构图。纯UI/相机构图修改，CX_RULE_VERSION继续为S0005-0289。','gold');
log('S0005-0291：修复两个近战近似肩并肩同向行走时常由其中一人间歇性摆动。根因是友军交通在逐单位顺序更新中混读本Tick新意图/新坐标与上一Tick旧意图/旧坐标，对称同行关系因此被单位数组顺序固定打破；动态拥堵场也可能由本Tick先移动的单位首次触发重建；同时近战并排追击纯3D稳定器被activeLocomotion提前return绕过。现建立Jacobi式Tick友军preferred-intent只读快照并统一使用Tick开始坐标：本Tick全部局部交通、TTC、友军接触路权和拥堵场刷新都在任何单位移动前冻结，本Tick新意图只供下一Tick；另让parallelPursuit在正常行走时真正生效并把视觉滞后硬限制18°。无桥/近战双人/ID特判。该修改影响权威移动交通裁决，CX_RULE_VERSION升级为S0005-0291。','gold');
log('S0005-0292：开战倒计时严格按stage水平几何中心定位且数字100%不透明；【准备好了点这里】移到数字上方；所有战斗记录导出按钮统一命名【保存战斗记录】；将领选择层移到己方半场并高于倒计时。新增【战旗-治疗】：持续8秒，3.75格内己方移动单位直接复用战地恢复型重装同一恢复计时、回血比例与绿色治疗粒子；与将领恢复重叠不叠加，治疗旗不会伪暴露隐藏将领；PVE AI、联机、记录与回放统一接入。规则版本升级S0005-0292。','gold');
log('S0005-0294：校正【重装兵将领C·守护者】表述：锁定约束是逐受召单位独立生效——每个受召小型单位必须等“它当前受召攻击的目标”死亡后，才能接受下一次守护召集。该逻辑在S0293已如此实现，本版不改变战斗裁决，仅消除“原守护目标”可能被误解为全局事件目标的歧义。','gold');
log('S0005-0286：修复S0285加载后直接卡死。根因是永久删除旧模型切换链时删掉refreshModelModeUI3D定义，却遗漏启动阶段一次调用，初始化执行到此抛ReferenceError，后续控件绑定、reset、requestAnimationFrame均未执行。现删除该悬空调用，并对S0284→S0285所有被删除函数做引用闭合扫描，确认无其他被删函数仍被调用；战斗规则不变。','gold');
log('S0005-0285：整合UI与PVE阵营手术：左侧战前部署去掉【战前】尾标并使用灰色坐标底板，所有坐标文字统一黑色；真人联机右栏与PVE统一保留、禁用并灰显；模拟顶栏模型切换按钮及整套历史兵模构建/分流/动画链永久删除，仅保留当前C3D模型；PVE顶部阵营改为红蓝切换按钮，战前部署开始后锁定且保持阵营色，同时玩家输入、AI、将领、战旗、记录与胜负视角统一跟随所选阵营。客户端UI/控制层升级，现行权威战斗规则仍为S0005-0281。','gold');
log('S0005-0284：左侧双方操作记录的战旗行去掉通用【战旗】尾标；战旗类型文字（箭雨/火球）从图标旁移到该行最末端。时间、战旗图标、坐标及红蓝阵营色坐标底板均保持不变。纯UI修改，CX_RULE_VERSION继续为S0005-0281。','gold');
log('S0005-0281：修复射手对射手不存在最小射程。根因是最小射程状态机过去错误地以目标射程<=1.20的“近战威胁分类”作为入口，导致敌射手等远程移动目标完全绕过脱离逻辑。现将最小射程统一定义为射手自身武器约束：对任何敌方移动单位都使用同一minRange→安全线脱离→回身状态机；建筑仍只受最大射程约束。目标选择、攻击前摇和友军意图预测共享同一判定函数，无兵种对兵种特判。','gold');
log('S0005-0279：修复窄通道内远距战斗停驻者长期堵死后续友军。根因是attack/range hold被交通层视为绝对stableStop，而后车在静态几何无真实横向旁路时只能永久queue。现新增通用战斗停驻吞吐释放：若后方同流向友军即将追尾，且从后车当前横截面起左右两侧都不存在连续静态可达旁路，拥有足够目标间距的停驻单位会沿自身既有追击方向短暂前移；前摇/后坐期间仍锁位，旁路恢复后立即恢复正常攻击。规则不识别桥/门洞，也不按射手兵种硬编码。','gold');

function updatePveStartCountdown(now){
 if(!pveStartCountdownActive)return;
 // S0196：联机与PVE共用同一30秒战前倒计时表现，但联机必须以校准后的服务器时钟为准，不能用本机performance.now()各算各的。
 const onlinePrep=clientMode==='battle'&&online.status==='matched'&&!started&&Number.isFinite(Number(online.startAt));
 const leftMs=onlinePrep?Math.max(0,Number(online.startAt)-onlineServerNow()):Math.max(0,pveStartCountdownEndAt-now);
 const whole=Math.max(0,Math.ceil(leftMs/1000-1e-9));
 if(whole!==pveStartCountdownLastWhole){
  pveStartCountdownLastWhole=whole;
  // S0005-0419：进入最后3秒即视同双方Ready。自动锁定战前状态，关闭将领选择和Ready按钮，倒计时恢复默认显示位置。
  if(whole<=3&&whole>=1&&clientMode==='pve'&&!started){
   pveReadyState={blue:true,red:true};
   closePveGeneralPicker();
   pveGeneralPickerOpenState=false;
   const readyBtn=null;
   if(readyBtn)readyBtn.hidden=true;
   syncPreBattleDeploymentUiState();
   updateGeneralSelectionUI();
   syncPveGeneralBattleSlots();
   syncPveStartCountdownPosition();
  }
  updatePveStartCountdownVisual(whole);
  if(whole<=3&&whole>=1)pveCountdownFinalTickSound(whole);
 }
 if(leftMs<=0){
  if(onlinePrep){pveStartCountdownActive=false;pveStartCountdownEndAt=0;pveStartCountdownLastWhole=null;updatePveStartCountdownVisual(0);beginOnlineMatch();}
  else launchPveMatchAfterCountdown();
 }
}

function handlePerfControlAt(clientX,clientY){if(!perfMonitor.expanded)return false;const p=perfMonitorPoint(clientX,clientY),c=perfMonitorControlRects(),hit=b=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;if(hit(c.res1024)){setPerfShadowMapSize(1024);draw();return true;}if(hit(c.res2048)){setPerfShadowMapSize(2048);draw();return true;}if(hit(c.res4096)){setPerfShadowMapSize(4096);draw();return true;}if(hit(c.shadow)){setPerfShadowEnabled(!cxShadowEnabled);draw();return true;}if(hit(c.proxy)){setPerfShadowProxyEnabled(!cxShadowProxyEnabled);draw();return true;}if(hit(c.biasA)){setPerfShadowBias(-0.00008);draw();return true;}if(hit(c.biasB)){setPerfShadowBias(-0.00004);draw();return true;}if(hit(c.biasC)){setPerfShadowBias(0);draw();return true;}if(hit(c.nBiasA)){setPerfShadowNormalBias(0.00135);draw();return true;}if(hit(c.nBiasB)){setPerfShadowNormalBias(0.0025);draw();return true;}if(hit(c.nBiasC)){setPerfShadowNormalBias(0.0040);draw();return true;}if(hit(c.skyNpc)){setPerfSkyNpcEnabled(!cxSkyNpcEnabled);draw();return true;}return false;}
function togglePerfMonitorAt(clientX,clientY){if(pointInPerfMonitor(clientX,clientY)){perfMonitor.expanded=!perfMonitor.expanded;draw();return true;}return false;}

function drawBattleSideMasks(){
 // S0005-0089：左右黑幕继续在2D覆盖层中绘制，同时新增更高层DOM遮罩，专门压住海雕/无人机等位于 eagle3d 上层画布中的空中NPC。
 const corners=[
  projectBoardPoint3D(0,0,.03),projectBoardPoint3D(COLS,0,.03),
  projectBoardPoint3D(0,ROWS,.03),projectBoardPoint3D(COLS,ROWS,.03)
 ];
 // A0258：双方交换会把 world3D 绕Y轴旋转180°，此时“逻辑左边界”会跑到屏幕右侧，
 // “逻辑右边界”会跑到屏幕左侧。旧算法分别取逻辑左/右边界，导致两个黑幕互相跨过棋盘并覆盖整屏。
 // 现在直接对旋转后的四个棋盘角点求真实屏幕 minX / maxX，交换前后都只遮棋盘外侧。
 const xs=corners.map(p=>p.x).filter(Number.isFinite);
 if(xs.length!==4){
  return;
 }
 const leftEdge=Math.max(0,Math.min(W,Math.min(...xs))),rightEdge=Math.max(0,Math.min(W,Math.max(...xs)));
 const leftWidth=Math.max(0,leftEdge),rightWidth=Math.max(0,W-rightEdge);

 ctx.save();
 ctx.fillStyle='rgba(0,0,0,.90)';
 ctx.fillRect(0,0,leftWidth,H);
 ctx.fillRect(rightEdge,0,rightWidth,H);
 ctx.restore();
}

function drawWalls(){
 const fullTop=Math.min(scy(NEUTRAL_START),scy(NEUTRAL_END));
 const bandY=fullTop+tileY*.30,bandH=tileY*1.40;
 const passages=PASSAGE_CELLS.map(c=>{const b=bridgeVisualBounds(c),x0=sx(b.left),x1=sx(b.right);return {left:Math.min(x0,x1),right:Math.max(x0,x1)};}).sort((a,b)=>a.left-b.left);

 for(const seg of passages){if(seg.left>cursor)segments.push([cursor,seg.left]);cursor=Math.max(cursor,seg.right);}
 const rightEdge=ox+boardW;if(cursor<rightEdge)segments.push([cursor,rightEdge]);
 for(const [lx,rx] of segments){
  const w=Math.max(2,rx-lx);
  const grd=ctx.createLinearGradient(0,bandY,0,bandY+bandH);
  grd.addColorStop(0,'#2aa4d6');grd.addColorStop(.50,'#49c9ef');grd.addColorStop(1,'#2393c3');

 }
}
function enemyWindupVisibility(d,opponentTeam){
 if(d.team!==opponentTeam)return 1;
 const remaining=Math.max(0,Math.min(1,d.left/Math.max(.0001,d.total)));
 const cfg=ENEMY_WINDUP_REVEAL;
 if(remaining>cfg.startRemaining)return 0;
 if(remaining<=cfg.fullRemaining)return 1;
 const raw=(cfg.startRemaining-remaining)/(cfg.startRemaining-cfg.fullRemaining);
 const eased=raw*raw*(3-2*raw); // 平滑渐显，避免突然跳亮。
 return cfg.startAlpha+(1-cfg.startAlpha)*eased;
}
function groundOverlayBlockedByBone(x,y,rx=.55,ry=.55){
 for(const g of ghosts){
  if(g.t<=0)continue;
  const extra=(g.type==='tank' ? .78 : (g.type==='turretRubble' ? .60 : .52))*(g.sizeScale||1);
  if(Math.abs(g.x-x)<=rx+extra&&Math.abs(g.y-y)<=ry+extra)return true;
 }
 return false;
}
function drawDeployments(){
 const opponentTeam=redAtBottom?'blue':'red'; // 玩家视角固定在屏幕下方；上方阵营视为对面。
 for(const d of visualDeploymentSources()){
  const size=deploymentFootprintSize(d.type),c=deploymentCenter(d.type,d.x,d.y);
  // A0108：活动部署提示属于关键操作信息，不能被骨头残骸遮蔽或整段跳过。
  // 骨头仍保留自身的3D遮挡关系，但部署图标与倒计时始终在UI层完整显示。
  const px=sx(c.x),py=sy(c.y),frameW=tile*size,frameH=tileY*size;
  ctx.save();ctx.translate(px,py);
  const visibility=enemyWindupVisibility(d,opponentTeam);
  if(visibility<=.001){ctx.restore();continue;}
  ctx.globalAlpha=visibility;
  if(focusWindup){ctx.fillStyle='#0009';roundedRect(-frameW*.58,-frameH*.58,frameW*1.16,frameH*1.16,Math.min(frameW,frameH)*.12);ctx.fill();}
  // 前摇圈已改为 Three.js 世界中的贴地圆环；在当前正交镜头下自然呈现 5:4 椭圆，不再由 UI 画布绘制。
  // A0163：取消部署倒计时地面单位图标的 A0138 呼吸/闪烁透明度，整个前摇期间保持恒定显示。
  ctx.globalAlpha=visibility;

  ctx.globalAlpha=visibility;
  const labelText=stableWindupTime(d),fontSize=Math.max(10,tileY*.48),padX=Math.max(3,Math.round(fontSize*.18)),padY=Math.max(1,Math.round(fontSize*.10));
  ctx.font=`900 ${fontSize}px Consolas, Menlo, monospace`;ctx.textAlign='center';
  const metrics=ctx.measureText(labelText),textW=Math.ceil(metrics.width),labelH=Math.ceil(fontSize+padY*2),plateW=Math.ceil(textW+padX*2),labelY=-frameH/2-Math.max(9,labelH*.42),plateColor=(MODE[d.mode]?.color)||MODE.normal.color;
  ctx.fillStyle=plateColor;roundedRect(-plateW/2,labelY-labelH/2,plateW,labelH,Math.min(tile,tileY)*.14);ctx.fill();
  ctx.fillStyle=d.mode==='normal'?'#10141a':'#fff';ctx.textBaseline='middle';ctx.fillText(labelText,0,labelY+.5);
  ctx.textBaseline='alphabetic';ctx.restore();
 }
}

function drawStressFlameIcon(cx,cy,size){
 ctx.save();
 ctx.translate(cx,cy);
 const s=Math.max(6,size);
 const img=stressFlameIconImage;
 const scale=.8;
 const h=s*1.85*scale;
 const w=img.naturalWidth&&img.naturalHeight?h*(img.naturalWidth/img.naturalHeight):h*.95;
 if(img.complete&&img.naturalWidth){
  ctx.drawImage(img,-w/2,-h*.88,w,h);
 }else{
  // 回退占位：若图片尚未加载，使用一个简化火焰轮廓。
  ctx.beginPath();
  ctx.moveTo(0,-h*.46);
  ctx.bezierCurveTo(w*.26,-h*.28,w*.30,h*.02,0,h*.40);
  ctx.bezierCurveTo(-w*.26,h*.02,-w*.22,-h*.18,0,-h*.46);
  ctx.closePath();
  ctx.fillStyle='#ff8b1f';
  ctx.fill();
 }
 ctx.restore();
}

function drawTankRecoverySourceCrossIcon(cx,cy,size){

 const d=Math.max(7,size),r=d*.50;
 ctx.save();ctx.translate(cx,cy);
 ctx.shadowColor='rgba(0,0,0,.30)';ctx.shadowBlur=Math.max(1,d*.11);ctx.shadowOffsetY=Math.max(.4,d*.04);
 ctx.fillStyle='#2eae5f';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
 ctx.shadowColor='transparent';ctx.strokeStyle='rgba(255,255,255,.70)';ctx.lineWidth=Math.max(.8,d*.065);ctx.stroke();
 const arm=Math.max(2,d*.20),len=d*.60;
 ctx.fillStyle='#ffffff';
 ctx.beginPath();ctx.roundRect(-arm/2,-len/2,arm,len,arm*.22);ctx.fill();

}
function drawCrossedSwordsIcon(cx,cy,size){
 ctx.save();
 ctx.translate(cx,cy);
 // S0005-0122：继续使用系统原生“⚔️” emoji，并按用户要求在S0121基础上缩小25%。
 const s=Math.max(8,size)*1.3915;
 const baseFontSize=Math.max(13,s*1.38);
 const fontSize=baseFontSize*0.75;
 ctx.textAlign='center';
 ctx.textBaseline='middle';
 ctx.font=`${fontSize}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif`;
 // 仅保留很轻的暗投影，避免小尺寸下与草地背景粘在一起。
 ctx.shadowColor='rgba(0,0,0,.22)';
 ctx.shadowBlur=Math.max(1.0,fontSize*.07);
 ctx.shadowOffsetX=0;
 ctx.shadowOffsetY=Math.max(.4,fontSize*.035);
 ctx.fillText('⚔️',0,0);
 ctx.restore();
}
function drawTurretDismantleIcon(cx,cy,size,alpha=1){
 ctx.save();
 ctx.translate(cx,cy);
 ctx.globalAlpha*=Math.max(0,Math.min(1,alpha));
 const s=Math.max(8,size);
 ctx.rotate(-Math.PI*.24);
 ctx.strokeStyle='#ff4954';
 ctx.fillStyle='#ff4954';
 ctx.lineCap='round';
 ctx.lineJoin='round';
 ctx.shadowColor='rgba(255,54,66,.95)';
 ctx.shadowBlur=Math.max(5,s*.62);
 ctx.lineWidth=Math.max(2,s*.14);
 // 锤柄
 ctx.beginPath();
 ctx.moveTo(0,s*.38);
 ctx.lineTo(0,-s*.14);
 ctx.stroke();
 // 锤头
 const headW=s*.62,headH=s*.20;
 ctx.beginPath();
 ctx.roundRect(-headW*.50,-s*.31,headW,headH,Math.max(1,s*.045));
 ctx.fill();
 // 用一个很小的尾端节点提高低分辨率下的辨识度。
 ctx.beginPath();
 ctx.arc(0,s*.38,Math.max(1.2,s*.075),0,Math.PI*2);
 ctx.fill();
 ctx.restore();
}

   const px=sx(s.x),py=sy(s.y),r=vt*(.12+(1-s.t)*.25);ctx.strokeStyle=s.color;ctx.globalAlpha=Math.max(0,s.t*4);ctx.lineWidth=Math.max(1.5,vt*.028);ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  }
  for(const t of texts){
   let alpha=Math.min(1,t.t*2),rise=0;
   if(t.energyCost){
    const duration=Math.max(1,Number(t.durationMs)||1000),elapsed=Math.max(0,nowPerf-(Number(t.createdPerf)||nowPerf)),p=Math.max(0,Math.min(1,elapsed/duration));
    rise=30*(1-Math.pow(1-p,2));
    alpha=p<.12?p/.12:Math.max(0,(1-p)/.34);
   }
   ctx.globalAlpha=alpha;ctx.fillStyle=t.color;ctx.strokeStyle='#071018';ctx.lineWidth=t.energyCost?2.5:3;ctx.font=`900 ${Math.max(t.energyCost?10:10,vt*(t.energyCost?.135:.18))}px Microsoft YaHei`;ctx.textAlign='center';
   const tx=sx(t.x),ty=sy(t.y)-rise;
   ctx.strokeText(t.text,tx,ty);ctx.fillText(t.text,tx,ty);ctx.globalAlpha=1;
  }
}

function screenPointToLogicalBoard(clientX,clientY){
 const rect=canvas.getBoundingClientRect(),px=clientX-rect.left,py=clientY-rect.top;
 let vx=(px-ox)/Math.max(1e-6,tile),vy=(py-oy)/Math.max(1e-6,tileY);
 return redAtBottom?{x:vx,y:vy}:{x:COLS-vx,y:ROWS-vy};
}
function nearestLegalManualPlacement(team,type,boardX,boardY){
 let candidates=null;
 if(manualDragPlacement&&manualDragPlacement.team===team&&manualDragPlacement.type===type)candidates=ensureManualDragLegalCache(false)?.anchors||[];
 if(!candidates){
  const signature=manualPlacementLegalitySignature(team,type);candidates=buildManualPlacementLegalCache(team,type,signature).anchors;
 }
 let best=null;
 // A0257：合法锚点只在布局发生变化时重建；鼠标移动时只对缓存中的合法锚点做最近距离比较。
 for(const a of candidates){
  const dx=a.cx-boardX,dy=a.cy-boardY,dist2=dx*dx+dy*dy;
  if(!best||dist2<best.dist2-1e-9||(Math.abs(dist2-best.dist2)<=1e-9&&(a.y<best.y||(a.y===best.y&&a.x<best.x))))best={x:a.x,y:a.y,dist2};
 }
 return best;
}
function updateManualDragPlacement(clientX,clientY){
 if(!manualDragPlacement)return;
 const b=screenPointToLogicalBoard(clientX,clientY),cache=ensureManualDragLegalCache(false);
 // S0005-0134：重置已放置单位时，黑色遮罩就是严格的“不可落下区域”。指针处于遮罩内时不再自动吸附到远处合法格，松手会回原位。
 if(manualDragPlacement.existingUnitId){
  const cx=Math.floor(b.x),cy=Math.floor(b.y),inside=cx>=0&&cx<COLS&&cy>=0&&cy<ROWS&&!!cache?.covered?.[cy*COLS+cx];
  if(!inside){manualDragPlacement.hasLegal=false;return;}
 }
 const best=nearestLegalManualPlacement(manualDragPlacement.team,manualDragPlacement.type,b.x,b.y);
 if(best){manualDragPlacement.x=best.x;manualDragPlacement.y=best.y;manualDragPlacement.hasLegal=true;}else manualDragPlacement.hasLegal=false;
 // A0257：主循环本来就每个 requestAnimationFrame 绘制一次；pointermove 不再额外触发整场 Three.js 重绘。
}

function appendOnlineReplayEvent(evt){
 const r=online.replayCurrent;if(!r||!evt)return;
 if(r.actions.some(a=>a.serverSeq===evt.serverSeq))return;
 const a=evt.action||{},meta=decodeOnlineMetaAction(a);
 r.actions.push({
  id:`ONLINE-S${String(evt.serverSeq).padStart(6,'0')}`,
  index:r.actions.length,
  tick:evt.applyTick,
  time:evt.applyTick*SIM_STEP,
  team:evt.team,
  action:meta?.kind||'deploy',
  unit:a.unit,
  cell:[Number(a.x),Number(a.y)],
  windup:a.mode||'normal',
  meta:meta?{...meta}:undefined,
  rawAction:{...a},
  note:`联机serverSeq=${evt.serverSeq}; clientSeq=${evt.clientSeq??''}; applyAt=${evt.applyAt}`,
  decision:{summary:meta?.kind==='general'?`联机将领同步 #${evt.serverSeq}`:meta?.kind==='battleFlag'?`联机战旗 #${evt.serverSeq}`:`联机正式部署 #${evt.serverSeq}`},
  source:'online-server',
  serverSeq:evt.serverSeq,
  clientSeq:evt.clientSeq??null,
  applyAt:evt.applyAt
 });
 r.actions.sort((x,y)=>x.tick-y.tick||x.serverSeq-y.serverSeq);
 r.actions.forEach((x,i)=>x.index=i);
 r.completedThroughTick=Math.max(Number(r.completedThroughTick)||0,evt.applyTick||0,simTick||0);
 refreshOnlineReplayExportButton();updateRecordPanel();
}

function step(now){
 updatePerfMonitor(now);const raw=Math.max(0,(now-last)/1000);last=now;updateCoreDestructionResolution(now);
 if(started&&!paused&&!matchEnded&&!coreDestructionResolution){
  playTime=Math.min(MATCH_DURATION,playTime+raw);simAccumulator+=raw;
  while(simAccumulator+1e-10>=SIM_STEP&&!matchEnded&&!recordHalted&&!coreDestructionResolution){advanceSimulationFixed();simAccumulator-=SIM_STEP;}
  if(simAccumulator<0)simAccumulator=0;updateUI();
 }
 draw();requestAnimationFrame(step);
}

function togglePlayback(){
 if(onlineConnectionActive()||online.status==='opponent_left')return;
 if(coreDestructionResolution||matchEnded||(playbackMode==='record'&&recordCompletionPaused))return;

 paused=!paused;last=performance.now();setRunStateUI();draw();
}
function restartAndPlay(){if(onlineConnectionActive()||online.status==='opponent_left')return;if(recordContinuationActive&&loadedRecord){playbackMode='record';recordContinuationActive=false;recordActions=recordSourceActions.map((a,i)=>cloneOperationAction(a,i));activeRngSeed=normalizeSeed(loadedRecord.seed);}reset(true);last=performance.now();setRunStateUI();draw();}
function restartOrRematch(){
 if(online.terminalEndReason||online.status==='finished'||(clientMode==='battle'&&matchEnded)){
  disconnectOnline('new_game');
  clientMode='battle';playbackMode='demo';speed=PLAYBACK_BASE_SPEED;
  online.terminalEndReason='';
  online.localTeam=null;
  online._resultDialogDisconnected=false;
  onlineSetStatus('off');
  reset(false,{silent:true});
  started=false;paused=false;matchEnded=false;matchWinnerTeam=null;autoAI=false;redAtBottom=false;
  // S0006-0030：联机结果框【再来一局】直接重新进入连接流程；中央按钮显示 CONNECTING。
  updateFormationUI();setRunStateUI();updateUI();draw();
  setTimeout(connectOnline,120);
  return;
 }
 if(onlineConnectionActive()||online.status==='opponent_left'){
  disconnectOnline('rematch');
  clientMode='battle';playbackMode='demo';speed=PLAYBACK_BASE_SPEED;reset(false,{silent:true});updateFormationUI();setRunStateUI();updateUI();draw();
  setTimeout(connectOnline,120);
  return;
 }
 if(clientMode==='pve'&&playbackMode!=='record'){
  const finished=matchEnded;
  cancelPveStartCountdown();
  if(finished){
   reset(false,{silent:true});started=false;paused=false;matchEnded=false;matchWinnerTeam=null;autoAI=false;pveReadyState={blue:false,red:false};
   updateGeneralSelectionUI();syncActiveGeneralHudSlots();setRunStateUI();updateUI();draw();
   beginPveMatch();
   return;
  }
  started=false;paused=false;matchEnded=false;beginPveMatch();return;
 }
 restartAndPlay();
}

const replayFileInput=document.getElementById('cxReplayFile');
const coreStage=canvas3d;
// S0006-2005.10：性能面板触控。控制按钮只在pointerup触发一次；随后抑制浏览器合成click，避免手机一次触摸连续翻转两次。
let perfTapAt=0,perfTapX=0,perfTapY=0,lastTouchPerfToggleAt=0,perfControlSuppressClickUntil=0,perfControlLastAt=0;
coreStage.addEventListener('pointerup',e=>{
 if(!pointInPerfMonitor(e.clientX,e.clientY)){perfTapAt=0;return;}
 e.preventDefault();e.stopPropagation();
 const now=performance.now();
 if(perfMonitor.expanded&&now-perfControlLastAt>280&&handlePerfControlAt(e.clientX,e.clientY)){perfControlLastAt=now;perfControlSuppressClickUntil=now+750;perfTapAt=0;return;}
 if(e.pointerType!=='touch'&&e.pointerType!=='pen')return;
 const dt=now-perfTapAt,dist=Math.hypot(e.clientX-perfTapX,e.clientY-perfTapY);
 if(perfTapAt&&dt<=650&&dist<=64){perfTapAt=0;lastTouchPerfToggleAt=now;togglePerfMonitorAt(e.clientX,e.clientY);}
 else{perfTapAt=now;perfTapX=e.clientX;perfTapY=e.clientY;}
},{passive:false});
coreStage.addEventListener('dblclick',e=>{
 if(performance.now()-lastTouchPerfToggleAt<800)return;
 if(pointInPerfMonitor(e.clientX,e.clientY)){if(togglePerfMonitorAt(e.clientX,e.clientY)){e.preventDefault();e.stopPropagation();}}
});
coreStage.addEventListener('click',e=>{
 if(performance.now()<perfControlSuppressClickUntil)return;
 if(pointInPerfMonitor(e.clientX,e.clientY))return;
 replayFileInput.value='';replayFileInput.click();
});
replayFileInput.addEventListener('change',async()=>{
 const file=replayFileInput.files?.[0];if(!file)return;
 try{
  const text=await file.text();

  if(loaded?.ok===false)console.error('CX CoreRuntime replay validation failed',loaded.errors);
  else{last=performance.now();console.info(`CX CoreRuntime loaded ${loaded.record?.recordId||file.name}, ${recordSourceActions.length} actions, ${recordBattleFlagActions.length} flags.`);}
 }catch(err){console.error('CX CoreRuntime file load failed',err);}
});
